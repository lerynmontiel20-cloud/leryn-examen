<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetCare AI</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f6f9;
      color: #222;
    }
    h1, h2, h3 {
      margin-top: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
    }
    .card {
      background: #fff;
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      margin-bottom: 14px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    input, select, button {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background: #1f6feb;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button.secondary {
      background: #57606a;
    }
    button.danger {
      background: #cf222e;
    }
    #map {
      height: 360px;
      width: 100%;
      border-radius: 8px;
      background: #e5e7eb;
    }
    #chatLog {
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid #eee;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #fafafa;
    }
    .item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .item:last-child {
      border-bottom: none;
    }
    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>PetCare AI</h1>

  <!-- Buscador y filtros -->
  <div class="card">
    <h2>Buscar y filtrar</h2>
    <div class="row">
      <select id="filtroMascota">
        <option value="todos">Todas las mascotas</option>
        <option value="perro">Perro</option>
        <option value="gato">Gato</option>
      </select>
      <input id="filtroServicio" placeholder="Servicio (ej. peluquería, baño, vacunación)" />
      <input id="filtroTexto" placeholder="Nombre o dirección" />
      <button onclick="cargarEstablecimientos()">Buscar</button>
    </div>
  </div>

  <div class="grid">
    <div>
      <!-- Mapa interactivo -->
      <div class="card">
        <h2>Mapa interactivo</h2>
        <div id="map"></div>
        <div id="infoSeleccionado" class="item">
          Hacé clic en un marcador para ver sus detalles.
        </div>
      </div>

      <!-- Formulario de Alta / Modificación -->
      <div class="card">
        <h2 id="tituloForm">Agregar establecimiento</h2>
        <form id="formEstablecimiento" onsubmit="guardarEstablecimiento(event)">
          <input type="hidden" id="estId" />
          <div class="row">
            <input id="nombre" placeholder="Nombre" required />
            <select id="categoria" required>
              <option value="veterinaria">Veterinaria</option>
              <option value="peluqueria_canina">Peluquería canina</option>
              <option value="tienda">Tienda</option>
            </select>
            <select id="tipo_mascota" required>
              <option value="perro">Perro</option>
              <option value="gato">Gato</option>
              <option value="ambos">Ambos</option>
            </select>
          </div>
          <div class="row">
            <input id="servicios" placeholder="Servicios separados por coma (ej. baño, corte)" required />
            <input id="precios" placeholder="Precios (ej. Desde Gs. 60.000)" required />
            <input id="horarios" placeholder="Horarios (ej. Lun-Sáb 08:00-18:00)" required />
          </div>
          <div class="row">
            <input id="direccion" placeholder="Dirección" required />
            <input id="contacto" placeholder="Contacto" required />
          </div>
          <div class="row">
            <input id="latitud" type="number" step="any" placeholder="Latitud (ej. -25.2867)" required />
            <input id="longitud" type="number" step="any" placeholder="Longitud (ej. -57.5759)" required />
            <button type="submit">Guardar</button>
            <button type="button" class="secondary" onclick="limpiarFormulario()">Cancelar</button>
          </div>
        </form>
      </div>

      <!-- Listado con editar y eliminar -->
      <div class="card">
        <h2>Catálogo de establecimientos</h2>
        <div id="listaEstablecimientos"></div>
      </div>
    </div>

    <!-- Asistente inteligente -->
    <div class="card">
      <h2>Asistente inteligente PetCare AI</h2>
      <div id="chatLog"></div>
      <div class="row">
        <input
          id="chatInput"
          placeholder="Preguntá sobre cuidados o establecimientos..."
          style="flex: 1;"
          onkeydown="if(event.key==='Enter') enviarChat()"
        />
        <button onclick="enviarChat()">Enviar</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
